
# TRUSTFLOW — DBT GOLD PROJECT
# Configures analytical models built from validated Silver data.

name: 'trustflow_gold'
version: '1.0.0'
config-version: 2

# Connection profile defined in profiles.yml
profile: 'trustflow_gold'

# Project directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Generated dbt files
clean-targets:
  - "target"
  - "dbt_packages"

# Default configuration for all TrustFlow Gold models
models:
  trustflow_gold:
    +materialized: view
