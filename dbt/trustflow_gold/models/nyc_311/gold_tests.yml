
version: 2

# TRUSTFLOW — NYC 311 GOLD DATA QUALITY TESTS
# Validate model grain and required dimension columns.

models:

  - name: daily_complaints
    description: "Daily NYC 311 complaint summary"
    columns:
      - name: complaint_date
        data_tests:
          - not_null
          - unique

  - name: borough_metrics
    description: "Complaint summary by borough"
    columns:
      - name: borough
        data_tests:
          - not_null
          - unique

  - name: complaint_type_metrics
    description: "Complaint summary by complaint type"
    columns:
      - name: complaint_type
        data_tests:
          - not_null
          - unique

  - name: agency_performance
    description: "Complaint workload by agency"
    columns:
      - name: agency
        data_tests:
          - not_null
          - unique

  - name: resolution_time_metrics
    description: "Closure duration statistics by complaint type"
    columns:
      - name: complaint_type
        data_tests:
          - not_null
          - unique

  - name: borough_complaint_trends
    description: "Daily complaint trends for each borough"
    columns:
      - name: complaint_date
        data_tests:
          - not_null
      - name: borough
        data_tests:
          - not_null
